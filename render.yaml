# Render Blueprint for the API only, on Render's free plan. The website runs on Vercel and the
# database on Neon (both free). See "Deploying for free" in README.md.

services:
  - type: web
    name: shs-api
    runtime: python
    plan: free # sleeps after 15 idle minutes; the first request afterwards takes about a minute
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run before every start, so the schema always matches the code.
    # One process on purpose: sign-in limits, auto-schedule runs and waiting notifications live in its memory.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      # Neon's connection string (Dashboard > Connect), starting with postgresql://
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # The website's address on Vercel, for example https://shs-class-scheduling.vercel.app (same value twice).
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      # Who may manage every school (comma-separated emails).
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      # Student notifications: generate with  python -m app.push  (optional; empty = Follow is hidden).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
